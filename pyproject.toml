[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbrecruit"
version = "0.1.0"
description = "System-aware football recruitment pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "scipy==1.17.1",
    "socceraction==1.5.3",
    "statsbombpy==1.22.0",
    "multimethod==1.10",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ml = [
    "scikit-learn==1.9.1",
    "xgboost==2.1.4",
    "torch==2.14.0",
    "torch-geometric==2.8.0.post1",
    "shap==0.49.1",
    "pulp==3.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the local data caches"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
